project_name: krea2edit
output_dir: output/krea2edit
seed: 42

distributed:
  deepspeed_zero2: true

data:
  manifest: data/my_dataset/manifest.jsonl
  max_image_pixels: 1048576
  num_workers: 4

model:
  dtype: bf16
  dit:
    name_or_path: krea/Krea-2-Raw
    filename: raw.safetensors
  text_encoder_path: Qwen/Qwen3-VL-4B-Instruct
  vae_path: Qwen/Qwen-Image
  grounding_max_px: 768
  grounding_jitter_min: 384
  quantization:
    # Independent switches. DIT additionally supports experimental svdquant_dual.
    dit: int8
    text_encoder: int8
  # Used only when quantization.dit is svdquant_dual.
  svdquant_dual:
    name_or_path: weights/krea2edit-svdquant-dual.safetensors
    filename: null

lora:
  rank: 64
  alpha: 64
  dropout: 0.0
  target_modules: all-linear

train:
  batch_size: 2
  steps: 2000
  gradient_accumulation: 1
  gradient_checkpointing: true
  optimizer: adamw8bit
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: constant
  warmup_steps: 0
  timestep_sampling:
    # linear, sigmoid, weighted, logit_normal, mode, cosine_map,
    # lognorm_blend, shift, one_step, two_step, four_step, eight_step
    strategy: weighted
    logit_mean: 0.0
    logit_std: 1.0
    mode_scale: 1.29
  log_every: 1
  save_every: 250
  resume_from: null

logging:
  backend: wandb
