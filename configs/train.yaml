project_name: krea2edit
output_dir: output/krea2edit
seed: 42

distributed:
  deepspeed_zero2: true

data:
  manifest: data/my_dataset/manifest.jsonl
  # Per image, for target and every reference independently.
  min_image_pixels: 262144
  max_image_pixels: 1048576
  # RGBA alpha values at or below this value are treated as fully transparent.
  alpha_transparency_threshold: 8
  num_workers: 4

model:
  dtype: bf16
  dit:
    name_or_path: krea/Krea-2-Raw
    filename: raw.safetensors
  text_encoder_path: Qwen/Qwen3-VL-4B-Instruct
  vae_path: Qwen/Qwen-Image
  grounding_max_px: 768
  grounding_jitter_min: 384
  quantization:
    dit:
      backend: quanto
      # FP8 frozen base weights with BF16 activations (W8A16).
      weights: qfloat8
    text_encoder:
      backend: quanto
      weights: qint8

lora:
  rank: 64
  alpha: 64
  dropout: 0.0
  # gaussian preserves the previous behavior; nora_init normalizes every
  # down-projection column once before training, then trains as standard LoRA.
  initialization: nora_init  # gaussian or nora_init
  target_modules: all-linear

train:
  batch_size: 2
  steps: 2000
  gradient_accumulation: 1
  gradient_checkpointing: true
  # EMA accumulates trainable DiT/LoRA tensors in FP32 on the accelerator.
  # During the first N optimizer steps the effective decay is 0 (exact copy).
  ema:
    enabled: true
    decay: 0.9999
    warmup_steps: 100
    update_every: 1
    device: accelerator
  # Opt-in Self-Flow. Set enabled=true and loss.weights.self_flow=0.8 to use
  # the paper recipe; this adds one EMA-teacher forward per micro-batch.
  self_flow:
    enabled: false
    mask_ratio: 0.25
    student_layer_ratio: 0.3
    teacher_layer_ratio: 0.7
    projection: mlp  # mlp or identity
    projection_hidden_dim: 1024
  # mode is deterministic; independent_sample samples every VAE posterior separately.
  vae_latent_strategy: mode
  # These values are sampling weights, not loss multipliers.
  branch_sampling_weights:
    edit: 0.75
    instruction_dropout: 0.10
    noop: 0.15
  noop_prompts:
    - "Keep the image exactly unchanged."
    - "Make no changes to the image."
    - "Preserve the image exactly as it is."
    - "Return the image without any edits."
    - "Leave every visual detail unchanged."
    - "Do not alter anything in the image."
  # Independent coefficients: set any item to 0 to disable it. The largest
  # active coefficient is effectively the primary objective.
  loss:
    weights:
      fm: 1.0
      perceptual: 0.1
      pixel: 0.1
      self_flow: 0.0
    pixel_type: mse  # mse, l1, huber, charbonnier
    huber_delta: 1.0
    charbonnier_epsilon: 0.001
    # Checkpoint every predicted VAE decode and every enabled perceptual
    # backbone independently. Models remain frozen and in eval mode.
    gradient_checkpointing: true
    perceptual_dtype: bf16  # bf16 or fp32; intentionally independent of model.dtype
    # Absolute weights are not normalized. A zero-weight model is not loaded.
    # input_size is configured independently per backbone. Prediction and
    # target are both resized directly to it. Remove input_size from one entry
    # to use that backbone's aspect-preserving min/max range fitting instead.
    # Fixed H/W must be inside min/max and divisible by the model patch size.
    perceptual_backbones:
      - name: tipsv2
        model_path: google/tipsv2-b14
        input_size: 448
        min_input_size: 224
        max_input_size: 448
        weight: 0.0
      - name: dinov2
        model_path: facebook/dinov2-base
        input_size: 518
        min_input_size: 224
        max_input_size: 518
        weight: 1.0
      - name: dinov3
        model_path: facebook/dinov3-vits16-pretrain-lvd1689m
        # Main global crop: 256. High-resolution phase: 512/768.
        input_size: 512
        min_input_size: 256
        max_input_size: 768
        weight: 0.0
      - name: vgg
        input_size: 224
        min_input_size: 64
        max_input_size: 224
        weight: 1.0
  # adamw, adamw8bit, deepspeed_muon
  optimizer: adamw8bit
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.01
  # Used by deepspeed_muon. The auxiliary Adam group handles non-Muon tensors.
  muon_lr: 0.002
  muon_momentum: 0.95
  muon_weight_decay: 0.01
  muon_ns_method: gram
  adam_lr: 0.00012
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  adam_weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: constant
  warmup_steps: 0
  timestep_sampling:
    # linear, sigmoid, weighted, logit_normal, mode, cosine_map,
    # lognorm_blend, shift, one_step, two_step, four_step, eight_step
    strategy: weighted
    logit_mean: 0.0
    logit_std: 1.0
    mode_scale: 1.29
  log_every: 1
  save_every: 250
  resume_from: null

sample:
  enabled: false
  manifest: data/evaluate/manifest.jsonl
  # Counts optimizer updates, not gradient-accumulation micro-steps.
  every: 250
  steps: 20
  guidance_scale: 4.5
  negative_prompt: ""
  schedule_mu: null
  samples: []
  # samples:
  #   - id: scene-subject-0001
  #     seed: 42

logging:
  backend: wandb
