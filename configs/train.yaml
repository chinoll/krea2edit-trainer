project_name: krea2edit
output_dir: output/krea2edit
seed: 42

distributed:
  deepspeed_zero2: true

data:
  manifest: data/my_dataset/manifest.jsonl
  # Per image, for target and every reference independently.
  min_image_pixels: 262144
  max_image_pixels: 1048576
  # RGBA alpha values at or below this value are treated as fully transparent.
  alpha_transparency_threshold: 8
  num_workers: 4

model:
  dtype: bf16
  dit:
    name_or_path: krea/Krea-2-Raw
    filename: raw.safetensors
  text_encoder_path: Qwen/Qwen3-VL-4B-Instruct
  vae_path: Qwen/Qwen-Image
  grounding_max_px: 768
  grounding_jitter_min: 384
  quantization:
    dit:
      backend: quanto
      # FP8 frozen base weights with BF16 activations (W8A16).
      weights: qfloat8
    text_encoder:
      backend: quanto
      weights: qint8

lora:
  rank: 64
  alpha: 64
  dropout: 0.0
  target_modules: all-linear

train:
  batch_size: 2
  steps: 2000
  gradient_accumulation: 1
  gradient_checkpointing: true
  # adamw, adamw8bit, deepspeed_muon
  optimizer: adamw8bit
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.01
  # Used by deepspeed_muon. The auxiliary Adam group handles non-Muon tensors.
  muon_lr: 0.002
  muon_momentum: 0.95
  muon_weight_decay: 0.01
  muon_ns_method: gram
  adam_lr: 0.00012
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  adam_weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler: constant
  warmup_steps: 0
  timestep_sampling:
    # linear, sigmoid, weighted, logit_normal, mode, cosine_map,
    # lognorm_blend, shift, one_step, two_step, four_step, eight_step
    strategy: weighted
    logit_mean: 0.0
    logit_std: 1.0
    mode_scale: 1.29
  log_every: 1
  save_every: 250
  resume_from: null

sample:
  enabled: false
  manifest: data/evaluate/manifest.jsonl
  # Counts optimizer updates, not gradient-accumulation micro-steps.
  every: 250
  steps: 20
  guidance_scale: 4.5
  negative_prompt: ""
  schedule_mu: null
  samples: []
  # samples:
  #   - id: scene-subject-0001
  #     seed: 42

logging:
  backend: wandb
