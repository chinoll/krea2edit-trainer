project_name: krea2edit
output_dir: /data/krea2edit_runs/lora_512_8gpu_muon
seed: 42

distributed:
  deepspeed_zero2: true

data:
  manifest: /dev/shm/krea2edit_20260901/train/manifest.jsonl
  min_image_pixels: 147456
  max_image_pixels: 262144
  alpha_transparency_threshold: 8
  num_workers: 4

model:
  dtype: bf16
  dit:
    name_or_path: /dev/shm/krea2edit_20260901/models/Krea-2-Raw/raw.safetensors
    filename: null
  text_encoder_path: /dev/shm/krea2edit_20260901/models/Krea-2-Raw/text_encoder
  vae_path: /dev/shm/krea2edit_20260901/models/Krea-2-Raw
  grounding_max_px: 512
  grounding_jitter_min: 384
  max_prompt_tokens: 384
  quantization:
    dit:
      backend: quanto
      weights: qfloat8
    text_encoder:
      backend: quanto
      weights: qint8

lora:
  rank: 64
  alpha: 64
  dropout: 0.0
  target_modules: all-linear

train:
  batch_size: 4
  steps: 2000
  gradient_accumulation: 4
  gradient_checkpointing: true
  optimizer: deepspeed_muon
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.01
  muon_lr: 0.002
  muon_momentum: 0.95
  muon_weight_decay: 0.01
  muon_ns_method: gram
  adam_lr: 0.00012
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  adam_weight_decay: 0.01
  max_grad_norm: 0.0
  lr_scheduler: constant_with_warmup
  warmup_steps: 1000
  timestep_sampling:
    strategy: weighted
    logit_mean: 0.0
    logit_std: 1.0
    mode_scale: 1.29
  log_every: 1
  save_every: 500
  resume_from: null

sample:
  enabled: true
  manifest: /dev/shm/krea2edit_20260901/validation/manifest.jsonl
  every: 500
  steps: 20
  guidance_scale: 4.5
  negative_prompt: ""
  schedule_mu: null
  samples:
    - id: conceptedit__conceptedit-enhanced-random-batch_4-45459_0_3
      width: 512
      height: 512
      seed: 42
    - id: noobedit__noob-gamecg-001823291-edit1
      width: 512
      height: 512
      seed: 43
    - id: conceptedit__conceptedit-enhanced-random-batch_30-307809_0_7
      width: 512
      height: 512
      seed: 44
    - id: noobedit__noob-gamecg-001836230-edit1
      width: 512
      height: 512
      seed: 45

logging:
  backend: wandb
